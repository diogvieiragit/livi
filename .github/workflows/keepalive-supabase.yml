name: Manter Supabase ativo

on:
  schedule:
    - cron: '17 11 * * *'
  workflow_dispatch:

permissions:
  actions: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consultar o banco do Livi
        env:
          SUPABASE_URL: https://jbezirmtygdwtiexgfow.supabase.co
          SUPABASE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpiZXppcm10eWdkd3RpZXhnZm93Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk3NDQ1MzYsImV4cCI6MjA5NTMyMDUzNn0.DySgkHNl0xwpPi9S11PJxRlNNgf_seLd6h-TQywnJuU
        run: |
          curl -sSf --retry 3 --retry-delay 30 --retry-all-errors \
            "$SUPABASE_URL/rest/v1/clientes?select=id&limit=1" \
            -H "apikey: $SUPABASE_KEY" -H "Authorization: Bearer $SUPABASE_KEY"

      # Repositório público: o GitHub desliga agendamentos após 60 dias sem atividade.
      - name: Manter o agendamento ligado
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/keepalive-supabase.yml/enable"
