<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Livi. Colchões &amp; Planejados</title>
<link rel="icon" href="https://jbezirmtygdwtiexgfow.supabase.co/storage/v1/object/public/images/1.svg" type="image/svg+xml">
<link rel="icon" href="https://jbezirmtygdwtiexgfow.supabase.co/storage/v1/object/public/images/1.png" type="image/png">
<link rel="apple-touch-icon" href="https://jbezirmtygdwtiexgfow.supabase.co/storage/v1/object/public/images/1.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap');
:root {
  --bg:#0f0f11;--bg2:#17171a;--bg3:#1e1e22;--bg4:#26262c;
  --border:rgba(255,255,255,0.08);--border2:rgba(255,255,255,0.14);
  --text:#f0f0f2;--text2:#9090a0;--text3:#60606e;
  --green:#22d07a;--green-bg:rgba(34,208,122,0.1);
  --red:#f05555;--red-bg:rgba(240,85,85,0.1);
  --amber:#f0a830;--amber-bg:rgba(240,168,48,0.1);
  --blue:#5b9cf6;--blue-bg:rgba(91,156,246,0.1);
  --ml:#ffd700;--ml-bg:rgba(255,215,0,0.1);
  --olx:#f57c00;--olx-bg:rgba(245,124,0,0.1);
  --sh:#f06292;--sh-bg:rgba(240,98,146,0.1);
  --radius:10px;--radius-sm:6px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.5;min-height:100vh}
#app{display:flex;min-height:100vh}

/* SIDEBAR */
.sidebar{width:220px;flex-shrink:0;background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:24px 0;position:sticky;top:0;height:100vh;overflow-y:auto}
.logo{padding:0 20px 24px;border-bottom:1px solid var(--border);margin-bottom:16px}
.logo-title{font-size:15px;font-weight:600;color:var(--text)}
.logo-sub{font-size:11px;color:var(--text3);margin-top:2px;font-family:'DM Mono',monospace}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 20px;cursor:pointer;color:var(--text2);font-size:13px;font-weight:500;border-left:2px solid transparent;transition:all .15s;user-select:none}
.nav-item:hover{color:var(--text);background:var(--bg3)}
.nav-item.active{color:var(--text);border-left-color:var(--green);background:rgba(34,208,122,.06)}
.nav-item svg{width:16px;height:16px;flex-shrink:0;opacity:.7}
.nav-item.active svg{opacity:1}
.nav-section-label{font-size:10px;font-weight:600;color:var(--text3);letter-spacing:.08em;text-transform:uppercase;padding:16px 20px 6px}

/* MAIN */
.main{flex:1;overflow-y:auto;padding:28px 32px;max-width:1100px}
.page-title{font-size:20px;font-weight:600;color:var(--text);margin-bottom:20px}
.section{display:none}.section.active{display:block}

/* LOADING */
.loading-overlay{position:fixed;inset:0;background:rgba(15,15,17,.8);display:flex;align-items:center;justify-content:center;z-index:100;font-size:14px;color:var(--text2);gap:10px}
.spinner{width:18px;height:18px;border:2px solid var(--bg4);border-top-color:var(--green);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* METRICS */
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:20px}
.mc{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:16px}
.mc-label{font-size:11px;color:var(--text3);margin-bottom:6px;text-transform:uppercase;letter-spacing:.05em;font-weight:500}
.mc-val{font-size:22px;font-weight:600;color:var(--text);font-family:'DM Mono',monospace}
.mc-sub{font-size:11px;color:var(--text3);margin-top:4px}
.mc-green .mc-val{color:var(--green)}.mc-red .mc-val{color:var(--red)}.mc-amber .mc-val{color:var(--amber)}.mc-blue .mc-val{color:var(--blue)}

/* CARDS */
.card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:16px}
.card-header{padding:14px 18px;border-bottom:1px solid var(--border);font-size:13px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.05em;display:flex;align-items:center;justify-content:space-between}
.card-body{padding:16px 18px}

/* TABLES */
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;table-layout:fixed}
th{font-size:10px;font-weight:600;color:var(--text3);text-align:left;padding:10px 14px;border-bottom:1px solid var(--border);text-transform:uppercase;letter-spacing:.06em}
td{font-size:13px;color:var(--text);padding:10px 14px;border-bottom:1px solid var(--border);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--bg3)}
.row-click{cursor:pointer}

/* BADGES */
.badge{display:inline-block;font-size:11px;font-weight:500;padding:3px 9px;border-radius:20px;white-space:nowrap}
.b-ok{background:var(--green-bg);color:var(--green)}
.b-at{background:var(--red-bg);color:var(--red)}
.b-in{background:#2a0000;color:#ff5555;border:1px solid rgba(255,60,60,.5);font-weight:600}
.b-pe{background:var(--amber-bg);color:var(--amber)}
.b-done{background:var(--bg4);color:var(--text3)}
.b-blue{background:var(--blue-bg);color:var(--blue)}
.b-ml{background:var(--ml-bg);color:var(--ml)}
.b-olx{background:var(--olx-bg);color:var(--olx)}
.b-sh{background:var(--sh-bg);color:var(--sh)}

/* ALERTS */
.alert{display:flex;align-items:center;gap:10px;padding:12px 16px;border-radius:var(--radius-sm);font-size:13px;margin-bottom:12px;border:1px solid}
.alert-red{background:var(--red-bg);color:var(--red);border-color:rgba(240,85,85,.2)}
.alert-amber{background:var(--amber-bg);color:var(--amber);border-color:rgba(240,168,48,.2)}

/* BARS */
.bar-row{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.bar-label{font-size:12px;color:var(--text2);width:80px;flex-shrink:0;text-align:right}
.bar-bg{flex:1;background:var(--bg4);border-radius:3px;height:14px;overflow:hidden}
.bar-fill{height:100%;border-radius:3px;transition:width .4s ease}
.bar-val{font-size:12px;color:var(--text);width:90px;flex-shrink:0;font-family:'DM Mono',monospace}

/* GRIDS */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:16px}

/* FORMS */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.form-group label{display:block;font-size:11px;color:var(--text3);margin-bottom:5px;text-transform:uppercase;letter-spacing:.05em;font-weight:600}
input[type=text],input[type=number],input[type=date],select,textarea{width:100%;background:var(--bg3);border:1px solid var(--border2);border-radius:var(--radius-sm);color:var(--text);font-family:'DM Sans',sans-serif;font-size:13px;padding:9px 12px;outline:none;transition:border-color .15s}
input:focus,select:focus{border-color:var(--green)}
select option{background:var(--bg3)}

/* FORM PANEL (collapsible) */
.form-panel{background:var(--bg3);border:1px solid var(--border2);border-radius:var(--radius);padding:18px;margin-bottom:16px;display:none}
.form-panel.open{display:block}

/* DYNAMIC PRODUCT ROWS */
.prod-row{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.prod-row input{flex:1}
.prod-row-rm{background:transparent;border:1px solid var(--border2);color:var(--text3);border-radius:var(--radius-sm);padding:7px 10px;cursor:pointer;font-size:12px;flex-shrink:0;transition:all .15s}
.prod-row-rm:hover{border-color:var(--red);color:var(--red)}

/* BUTTONS */
button.btn{background:var(--green);color:#0f0f11;border:none;border-radius:var(--radius-sm);font-family:'DM Sans',sans-serif;font-size:13px;font-weight:600;padding:10px 18px;cursor:pointer;transition:opacity .15s;width:100%}
button.btn:hover{opacity:.88}
button.btn:disabled{opacity:.5;cursor:not-allowed}
button.btn-ghost{background:transparent;border:1px solid var(--border2);color:var(--text2);border-radius:var(--radius-sm);font-family:'DM Sans',sans-serif;font-size:12px;padding:7px 14px;cursor:pointer;transition:all .15s}
button.btn-ghost:hover{border-color:var(--green);color:var(--green)}
button.btn-danger{background:transparent;border:1px solid rgba(240,85,85,.3);color:var(--red);border-radius:var(--radius-sm);font-family:'DM Sans',sans-serif;font-size:12px;padding:7px 14px;cursor:pointer;transition:all .15s}
button.btn-danger:hover{background:var(--red-bg);border-color:var(--red)}
.form-divider{grid-column:1/-1;font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;font-weight:600;border-top:1px solid var(--border);padding-top:12px;margin-top:4px}
.btn-contrato{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;background:var(--blue-bg);color:var(--blue);border:1px solid rgba(91,156,246,.3);border-radius:var(--radius-sm);font-size:12px;font-weight:500;cursor:pointer;transition:all .15s;font-family:'DM Sans',sans-serif}
.btn-contrato:hover{background:rgba(91,156,246,.2)}
.action-btn{background:transparent;border:none;cursor:pointer;font-size:11px;padding:2px 8px;border-radius:var(--radius-sm);border:1px solid var(--border2);color:var(--text2);font-family:'DM Sans',sans-serif;transition:all .15s}
.action-btn:hover{border-color:var(--green);color:var(--green)}
.action-btn.danger:hover{border-color:var(--red);color:var(--red)}

/* SEARCH ROW */
.search-row{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap;align-items:center}
.search-row input,.search-row select{max-width:200px;width:auto;flex:1}

.msg-ok{font-size:12px;color:var(--green);margin-top:8px}
.msg-err{font-size:12px;color:var(--red);margin-top:8px}
.saldo-pos{color:var(--green);font-weight:600;font-family:'DM Mono',monospace}
.saldo-neg{color:var(--red);font-weight:600;font-family:'DM Mono',monospace}
.mono{font-family:'DM Mono',monospace}

.list-item{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border)}
.list-item:last-child{border-bottom:none}

/* MODAL */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:200;align-items:center;justify-content:center;padding:16px}
.modal-overlay.open{display:flex}
.modal-box{background:var(--bg2);border:1px solid var(--border2);border-radius:14px;width:100%;max-width:520px;max-height:90vh;overflow-y:auto;box-shadow:0 24px 64px rgba(0,0,0,.6)}
.modal-header{display:flex;align-items:center;justify-content:space-between;padding:18px 20px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--bg2);z-index:1}
.modal-title{font-size:16px;font-weight:600;color:var(--text)}
.modal-close{background:var(--bg4);border:none;color:var(--text2);width:28px;height:28px;border-radius:50%;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;transition:all .15s}
.modal-close:hover{background:var(--red-bg);color:var(--red)}
.modal-body{padding:20px}
.modal-info-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
.modal-info-item label{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.05em;display:block;margin-bottom:3px}
.modal-info-item span{font-size:13px;color:var(--text)}
.modal-section-title{font-size:10px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.08em;margin:16px 0 10px}
.parc-row{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border);font-size:12px}
.parc-row:last-child{border-bottom:none}
.parc-paga{color:var(--text3);text-decoration:line-through}
.modal-actions{display:flex;gap:8px;margin-top:20px}
.modal-actions button{flex:1}
.manual-toggle{display:flex;align-items:center;gap:8px;padding:10px 12px;background:var(--bg3);border-radius:var(--radius-sm);margin-bottom:16px;font-size:12px;color:var(--text2);cursor:pointer;border:1px solid transparent;transition:border-color .15s}
.manual-toggle:hover{border-color:var(--amber)}
.manual-toggle input[type=checkbox]{width:auto;accent-color:var(--amber)}

::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--bg4);border-radius:3px}

/* ── MOBILE ── */
@media(max-width:700px){
  #app{overflow-x:hidden}
  .sidebar{display:none}
  .main{padding:14px 14px 80px;overflow-x:hidden}
  .page-title{font-size:17px;margin-bottom:14px}
  .metrics{grid-template-columns:1fr 1fr}
  .mc-val{font-size:18px}
  .grid2{grid-template-columns:1fr}
  .grid3{grid-template-columns:1fr 1fr}
  .form-grid{grid-template-columns:1fr}
  td{padding:8px 8px;font-size:12px}
  th{padding:7px 8px}
  .hide-mob{display:none}
  table{table-layout:auto}
  .badge{font-size:9px;padding:2px 6px}
  .action-btn{font-size:10px;padding:2px 6px}
  input[type=text],input[type=number],input[type=date],select,textarea{font-size:16px}
  .modal-info-grid{grid-template-columns:1fr}
  .modal-actions{flex-direction:column}

  .mob-header{display:flex;align-items:center;justify-content:space-between;padding:13px 16px;background:var(--bg2);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:20}
  .mob-header-logo{font-size:14px;font-weight:600;color:var(--text)}
  .mob-header-sub{font-size:11px;color:var(--text3);font-family:'DM Mono',monospace}

  .bottom-nav{display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--bg2);border-top:1px solid var(--border);z-index:50;height:62px;padding-bottom:env(safe-area-inset-bottom)}
  .bn-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;color:var(--text3);font-size:10px;font-weight:500;-webkit-tap-highlight-color:transparent;transition:color .15s}
  .bn-item.active{color:var(--green)}
  .bn-item svg{width:20px;height:20px}

  .mob-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:55;backdrop-filter:blur(2px)}
  .mob-overlay.open{display:block}

  .mob-drawer{position:fixed;bottom:0;left:0;right:0;background:var(--bg2);border-radius:18px 18px 0 0;border-top:1px solid var(--border2);z-index:60;padding:0 16px calc(24px + env(safe-area-inset-bottom));transform:translateY(100%);transition:transform .28s cubic-bezier(.4,0,.2,1)}
  .mob-drawer.open{transform:translateY(0)}
  .drawer-handle{width:40px;height:4px;background:var(--bg4);border-radius:2px;margin:12px auto 20px}
  .drawer-title{font-size:10px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.08em;margin-bottom:12px}
  .drawer-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .drawer-item{display:flex;align-items:center;gap:10px;padding:14px 12px;background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius);cursor:pointer;color:var(--text2);font-size:13px;font-weight:500;-webkit-tap-highlight-color:transparent;transition:all .12s}
  .drawer-item svg{width:18px;height:18px;flex-shrink:0}
  .drawer-item.active{color:var(--green);background:var(--green-bg);border-color:rgba(34,208,122,.25)}
}
@media(min-width:701px){
  .mob-header{display:none}
  .bottom-nav{display:none}
  .mob-overlay{display:none!important}
  .mob-drawer{display:none!important}
}
</style>
</head>
<body>

</div>

<div id="app" style="display:none">
  <nav class="sidebar">

      <div id="visao"    class="section active"></div>

<script>
const { createClient } = supabase;
const SUPA_URL = 'https://jbezirmtygdwtiexgfow.supabase.co';
const SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpiZXppcm10eWdkd3RpZXhnZm93Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk3NDQ1MzYsImV4cCI6MjA5NTMyMDUzNn0.DySgkHNl0xwpPi9S11PJxRlNNgf_seLd6h-TQywnJuU';
const db = createClient(SUPA_URL, SUPA_KEY);

// ─── Helpers ─────────────────────────────────────────────────────────────────
const hoje = new Date(); hoje.setHours(0,0,0,0);

function esc(s) { return (s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function addMeses(d, n) {
  const r = new Date(d); const dia = r.getDate();
  r.setDate(1); r.setMonth(r.getMonth()+n);
  r.setDate(Math.min(dia, new Date(r.getFullYear(), r.getMonth()+1, 0).getDate()));
  return r;
}
function fmtDate(d) { if (!d||d==='—') return '—'; return new Date(d+'T12:00:00').toLocaleDateString('pt-BR'); }
function fmtMes(d)  { return new Date(d).toLocaleDateString('pt-BR',{month:'short',year:'2-digit'}); }
function fmtR(v)    { return 'R$ '+Math.round(v||0).toLocaleString('pt-BR'); }
function diff(a,b)  { return Math.floor((new Date(a)-new Date(b))/86400000); }

function isThisMonth(dateStr) {
  if (!dateStr) return false;
  const d = new Date(dateStr+'T12:00:00');
  return d.getMonth()===hoje.getMonth() && d.getFullYear()===hoje.getFullYear();
}

function parseProds(prod) {
  if (!prod) return [];
  try { const p=JSON.parse(prod); return Array.isArray(p)&&p.length?p:[prod]; } catch { return [prod]; }
}

function platBadge(p) {
  if (p==='ML')  return '<span class="badge b-ml">Mercado Livre</span>';
  if (p==='OLX') return '<span class="badge b-olx">OLX</span>';
  return '<span class="badge b-sh">Shopee</span>';
}

function statusBadge(st) {
  if (st==='inadimplente') return '<span class="badge b-in">⚠ Inadimplente</span>';
  if (st==='atrasado')     return '<span class="badge b-at">Atrasado</span>';
  if (st==='quitado')      return '<span class="badge b-done">Quitado</span>';
  return '<span class="badge b-ok">Em dia</span>';
}
function statusBadgeCompact(st) {
  if (st==='inadimplente') return '<span class="badge b-in">⚠ Inad.</span>';
  if (st==='atrasado')     return '<span class="badge b-at">Atrasado</span>';
  if (st==='quitado')      return '<span class="badge b-done">Quitado</span>';
  return '<span class="badge b-ok">Em dia</span>';
}

let clientes = [], boletos = [], vendasOnline = [];

// ─── Data Layer ──────────────────────────────────────────────────────────────
async function loadAll() {
  const fetchParcelas = async () => {
    const out = [];
    let from = 0;
    while (true) {
      const {data} = await db.from('parcelas').select('*').range(from, from+999);
      if (!data?.length) break;
      out.push(...data);
      if (data.length < 1000) break;
      from += 1000;
    }
    return out;
  };
  const [
    {data:cls,error:e1}, parc,
    {data:bols,error:e3}, {data:vend,error:e4},
  ] = await Promise.all([
    db.from('clientes').select('*').order('created_at',{ascending:false}),
    fetchParcelas(),
    db.from('boletos').select('*').order('venc',{ascending:true}),
    db.from('vendas_online').select('*').order('data',{ascending:false}),
  ]);
  if (e1||e3||e4) { console.error('Erro ao carregar',e1||e3||e4); return false; }
  clientes = (cls||[]).map(c => ({...c, parcelas:(parc||[]).filter(p=>p.cliente_id==c.id)}));
  boletos      = bols||[];
  vendasOnline = vend||[];
  return true;
}

function clienteStatus(c) {
  const parc = c.parcelas||[];
  if (parc.length>0 && parc.every(p=>p.paga)) return 'quitado';
  const pend = parc.filter(p=>!p.paga);
  const maxAt = pend.length ? Math.max(...pend.map(p=>diff(hoje,new Date(p.venc+'T12:00:00')))) : 0;
  if (maxAt>15) return 'inadimplente';
  if (c.atrasado_manual||maxAt>3) return 'atrasado';
  return 'em dia';
}

const BOTTOM_TABS = new Set(['visao','clientes','boletos','online']);

function _syncMobNav(id) {
  document.querySelectorAll('.bn-item').forEach(b=>b.classList.remove('active'));
  document.getElementById('bn-'+(BOTTOM_TABS.has(id)?id:'mais'))?.classList.add('active');
  document.querySelectorAll('.drawer-item').forEach(item=>item.classList.toggle('active',item.dataset.tab===id));
}

function showTab(id,el) {
  document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));
  document.querySelectorAll('.sidebar .nav-item').forEach(n=>n.classList.remove('active'));
  document.getElementById(id).classList.add('active');

  _syncMobNav(id); closeDrawer();
  renders[id]&&renders[id]();
}

function showTabMob(id) {
  document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');

function openDrawer() {
  const cur=document.querySelector('.section.active')?.id;
  document.querySelectorAll('.drawer-item').forEach(item=>item.classList.toggle('active',item.dataset.tab===cur));
  document.getElementById('mob-overlay')?.classList.add('open');

}

async function salvarEdicaoCliente(cId) {
  const c       = clientes.find(x=>x.id===cId);
  const nome    = document.getElementById('e-nome')?.value.trim();
  const tel     = document.getElementById('e-tel')?.value.trim();
  const total   = parseFloat(document.getElementById('e-total')?.value);
  const nparc   = parseInt(document.getElementById('e-nparc')?.value);
  const venc1   = document.getElementById('e-venc1')?.value;
  const indicado= document.getElementById('e-indicado')?.value.trim();
  const prods   = getProds('edit-prods');
  const cpf=document.getElementById('e-cpf')?.value.trim()||'';
  const rg=document.getElementById('e-rg')?.value.trim()||'';
  const prof=document.getElementById('e-prof')?.value.trim()||'';
  const email=document.getElementById('e-email')?.value.trim()||'';
  const ender=document.getElementById('e-ender')?.value.trim()||'';
  const cep=document.getElementById('e-cep')?.value.trim()||'';
  const entrada=parseFloat(document.getElementById('e-entrada')?.value)||0;
  const fpgSel=document.getElementById('e-fpg')?.value||'';
  const prazo=parseInt(document.getElementById('e-prazo')?.value)||0;
  if (!nome) { const m=document.getElementById('modal-msg'); if(m){m.className='msg-err';m.textContent='Nome é obrigatório.';} return; }
  const upd = {nome, tel:tel||null, indicado:indicado||null,
    cpf:cpf||null,rg:rg||null,profissao:prof||null,email:email||null,
    endereco:ender||null,cep:cep||null,entrada:entrada||0,
    forma_pagamento:(fpgSel&&fpgSel!=='Selecione')?fpgSel:null,prazo_entrega:prazo||null};
  if (!isNaN(total)&&total>0) upd.total=total;
  if (!isNaN(nparc)&&nparc>0) upd.nparc=nparc;
  if (!isNaN(total)&&!isNaN(nparc)&&nparc>0) upd.parc_val=(total-entrada)/nparc;
  if (prods.length) upd.prod=JSON.stringify(prods);
  const {error}=await db.from('clientes').update(upd).eq('id',cId);
  if (error) { const m=document.getElementById('modal-msg'); if(m){m.className='msg-err';m.textContent='Erro: '+error.message;} return; }
  if (venc1 && c) {
    const sorted = (c.parcelas||[]).sort((a,b)=>a.num-b.num);
    if (sorted.length && sorted[0].venc !== venc1) {
      const inicio = new Date(venc1+'T12:00:00');
      await Promise.all(sorted.map((p,i)=>
        db.from('parcelas').update({venc:addMeses(new Date(inicio),i).toISOString().split('T')[0]}).eq('id',p.id)
      ));
    }
  }
  await loadAll();
  _refreshActiveSection();
  abrirModal(cId);
}

async function excluirCliente(cId) {
  const {error}=await db.from('clientes').delete().eq('id',cId);
  if (error) { alert('Erro: '+error.message); return; }
  document.getElementById('modal-overlay').classList.remove('open');
  await loadAll(); renders.clientes();
}

async function toggleAtrasadoManual(cId, val) {
  const {error}=await db.from('clientes').update({atrasado_manual:val}).eq('id',cId);
  if (error) { alert('Erro: '+error.message); return; }
  await loadAll();
  _refreshActiveSection();
  abrirModal(cId);
}

async function marcarParcelaPaga(parcelaId, cId) {
  const p = clientes.flatMap(c=>c.parcelas||[]).find(x=>x.id===parcelaId);
  const hoje_str = new Date().toISOString().split('T')[0];
  const pagoEm = (p?.venc && p.venc < hoje_str) ? p.venc : hoje_str;
  const {error}=await db.from('parcelas').update({paga:true,pago_em:pagoEm}).eq('id',parcelaId);
  if (error) { alert('Erro: '+error.message); return; }
  await loadAll();
  _refreshActiveSection();
  abrirModal(cId);
}

function _refreshActiveSection() {
  const id = document.querySelector('.section.active')?.id;
  if (id&&renders[id]) renders[id]();
}

  const prox7b=boletos.filter(b=>!b.pago).filter(b=>{const d2=diff(new Date(b.venc+'T12:00:00'),hoje);return d2>=0&&d2<=7;}).sort((a,b2)=>new Date(a.venc)-new Date(b2.venc));
  const prox7c=[];
  clientes.forEach(c=>(c.parcelas||[]).forEach(p=>{
    if(!p.paga){
      const d2=diff(new Date(p.venc+'T12:00:00'),hoje);
      const atrasoDias=diff(hoje,new Date(p.venc+'T12:00:00'));
      if(d2>=0&&d2<=7||atrasoDias>0)

    }
  }));
  prox7c.sort((a,b)=>new Date(a.venc)-new Date(b.venc));

  if (isHoje) {
    html+=`<div class="grid2">
      <div class="card"><div class="card-header">Boletos vencendo em 7 dias</div><div class="card-body">
        ${prox7b.length?prox7b.map(b=>{const d2=diff(new Date(b.venc+'T12:00:00'),hoje);return`<div class="list-item"><div><div style="font-size:13px">${esc(b.fornecedor)}</div><div style="font-size:11px;color:var(--text3)">${esc(b.descricao)}</div></div><div style="text-align:right"><div class="mono" style="color:${d2<=2?'var(--red)':'var(--amber)'}">${fmtR(b.valor)}</div><div style="font-size:11px;color:var(--text3)">${fmtDate(b.venc)}</div></div></div>`;}).join(''):'<p style="font-size:13px;color:var(--text3)">Nenhum boleto vencendo em 7 dias</p>'}
      </div></div>
      <div class="card"><div class="card-header">Parcelas clientes — próx. 7 dias + atrasados</div><div class="card-body">
        ${prox7c.length?prox7c.map(p=>{
          const cor=p.atrasoDias>0?'var(--amber)':'var(--green)';
          const label=p.atrasoDias>0?`<span style="font-size:10px;color:var(--amber);margin-left:4px">(${p.atrasoDias}d atraso)</span>`:'';
          return`<div class="list-item" style="gap:8px">
            <div style="flex:1;min-width:0">
              <div style="font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(p.nome)}${label}</div>
              <div style="font-size:11px;color:var(--text3)">${fmtDate(p.venc)}</div>
            </div>
            <div class="mono" style="color:${cor};white-space:nowrap">${fmtR(p.valor)}</div>
            <button class="action-btn" onclick="marcarParcelaPagaVisao('${p.id}','${p.cId}')">✓ Pago</button>
          </div>`;
        }).join(''):'<p style="font-size:13px;color:var(--text3)">Nenhuma parcela pendente</p>'}
      </div></div>
    </div>`;
  } else {
    const bolMesList = bolAbertoMes.sort((a,b2)=>new Date(a.venc)-new Date(b2.venc));
    const parcMes = [];
    clientes.forEach(c=>(c.parcelas||[]).filter(p=>!p.paga&&isSelMonth(p.venc)).forEach(p=>parcMes.push({nome:c.nome,venc:p.venc,valor:p.valor})));
    parcMes.sort((a,b2)=>new Date(a.venc)-new Date(b2.venc));
    html+=`<div class="grid2">
      <div class="card"><div class="card-header">Boletos do mês</div><div class="card-body">
        ${bolMesList.length?bolMesList.map(b=>{const d2=diff(hoje,new Date(b.venc+'T12:00:00'));const vencido=d2>0;return`<div class="list-item"><div><div style="font-size:13px">${esc(b.fornecedor)}</div><div style="font-size:11px;color:var(--text3)">${esc(b.descricao)}${vencido?' · <span style="color:var(--red)">vencido</span>':''}</div></div><div style="text-align:right"><div class="mono" style="color:${vencido?'var(--red)':'var(--text)'}">${fmtR(b.valor)}</div><div style="font-size:11px;color:var(--text3)">${fmtDate(b.venc)}</div></div></div>`;}).join(''):'<p style="font-size:13px;color:var(--text3)">Nenhum boleto neste mês</p>'}
      </div></div>
      <div class="card"><div class="card-header">Parcelas do mês</div><div class="card-body">
        ${parcMes.length?parcMes.map(p=>`<div class="list-item"><div style="font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:160px">${esc(p.nome)}</div><div style="text-align:right"><div class="mono" style="color:var(--green)">${fmtR(p.valor)}</div><div style="font-size:11px;color:var(--text3)">${fmtDate(p.venc)}</div></div></div>`).join(''):'<p style="font-size:13px;color:var(--text3)">Nenhuma parcela neste mês</p>'}
      </div></div>
    </div>`;
  }
  el.innerHTML=html;
},

projecao() {
  const prox=Array.from({length:6},(_,i)=>{const d=addMeses(new Date(hoje),i);return{d,label:fmtMes(d),rec:0,pagar:0,cnt:0};});
  clientes.forEach(c=>(c.parcelas||[]).filter(p=>!p.paga).forEach(p=>{
    prox.forEach(m=>{const pv=new Date(p.venc+'T12:00:00');if(pv.getMonth()===m.d.getMonth()&&pv.getFullYear()===m.d.getFullYear()){m.rec+=p.valor;m.cnt++;}});
  }));
  boletos.filter(b=>!b.pago).forEach(b=>{const bv=new Date(b.venc+'T12:00:00');prox.forEach(m=>{if(bv.getMonth()===m.d.getMonth()&&bv.getFullYear()===m.d.getFullYear())m.pagar+=b.valor;});});
  const totRec6=prox.reduce((s,m)=>s+m.rec,0);
  const totPag6=prox.reduce((s,m)=>s+m.pagar,0);
  const saldo6=totRec6-totPag6;
  const maxBar=Math.max(...prox.flatMap(m=>[m.rec,m.pagar]),1);
  document.getElementById('projecao').innerHTML=`
    <div class="page-title">Projeção financeira</div>
    <div class="metrics">
      <div class="mc mc-green"><div class="mc-label">Receita prevista (6m)</div><div class="mc-val">${fmtR(totRec6)}</div></div>

      <div class="mc ${saldo6>=0?'mc-green':'mc-red'}"><div class="mc-label">Saldo líquido (6m)</div><div class="mc-val">${fmtR(saldo6)}</div></div>
    </div>
    <div class="card">
      <div class="card-header">Receber vs pagar — próximos 6 meses</div>

            <div class="bar-bg"><div class="bar-fill" style="width:${Math.round(m.rec/maxBar*100)}%;background:var(--green)"></div></div>
            <div class="bar-val">${fmtR(m.rec)}</div>
          </div>
          <div class="bar-row">
            <div class="bar-label" style="color:var(--red);font-size:11px">Pagar</div>
            <div class="bar-bg"><div class="bar-fill" style="width:${Math.round(m.pagar/maxBar*100)}%;background:var(--red)"></div></div>
            <div class="bar-val">${fmtR(m.pagar)}</div>
          </div>
        </div>`).join('')}</div>
    </div>
    <div class="card">
      <div class="card-header">Fluxo de caixa mensal</div>
      <div class="tbl-wrap"><table>
        <thead><tr><th>Mês</th><th>Parcelas</th><th>A receber</th><th>A pagar</th><th>Saldo</th></tr></thead>
        <tbody>${prox.map(m=>{const s=m.rec-m.pagar;return`<tr>
          <td>${m.label}</td><td>${m.cnt}</td>
          <td class="mono" style="color:var(--green)">${fmtR(m.rec)}</td>

function _renderCl() {
  const q=(document.getElementById('sc-q')?.value||'').toLowerCase();
  const st=document.getElementById('sc-st')?.value||'';
  const ord=document.getElementById('sc-ord')?.value||'venc';
  const f=clientes.filter(c=>{
    const prods=parseProds(c.prod).join(' ').toLowerCase();
    const matchQ=!q||c.nome.toLowerCase().includes(q)||prods.includes(q);
    const matchSt=!st||clienteStatus(c)===st;
    return matchQ&&matchSt;
  });
  if(ord==='nome') f.sort((a,b)=>a.nome.localeCompare(b.nome,'pt-BR'));
  else if(ord==='nome-desc') f.sort((a,b)=>b.nome.localeCompare(a.nome,'pt-BR'));
  else if(ord==='venc') f.sort((a,b)=>{
    const proxA=(a.parcelas||[]).filter(p=>!p.paga).sort((x,y)=>new Date(x.venc)-new Date(y.venc))[0];
    const proxB=(b.parcelas||[]).filter(p=>!p.paga).sort((x,y)=>new Date(x.venc)-new Date(y.venc))[0];
    if(!proxA&&!proxB) return 0; if(!proxA) return 1; if(!proxB) return -1;
    return new Date(proxA.venc)-new Date(proxB.venc);
  });
  const body=document.getElementById('cl-body'); if (!body) return;
  const cntEl=document.getElementById('cl-count'); if(cntEl) cntEl.textContent=`(${f.length})`;
  const totEl=document.getElementById('cl-total'); if(totEl) totEl.textContent=f.length?fmtR(f.reduce((s,c)=>s+(c.total||0),0)):'';
  if (!f.length){body.innerHTML=`<tr><td colspan="5" style="color:var(--text3);text-align:center;padding:20px">Nenhum cliente encontrado</td></tr>`;return;}
  body.innerHTML=f.map(c=>{
    const pagas=(c.parcelas||[]).filter(p=>p.paga).length;
    const st2=clienteStatus(c);
    const prods=parseProds(c.prod);
    const prodLabel=prods.length?prods[0].split(' ').slice(0,2).join(' ')+(prods.length>1?` +${prods.length-1}`:''):'—';
    return`<tr class="row-click" onclick="abrirModal('${c.id}')">
      <td style="font-weight:500" title="${esc(c.nome)}">${esc(c.nome)}</td>
      <td class="hide-mob" title="${esc(prods.join(', '))}">${esc(prodLabel)}</td>
      <td class="hide-mob mono">${fmtR(c.total)}</td>
      <td>${pagas}/${c.nparc||0}</td>
      <td>${statusBadgeCompact(st2)}</td>
    </tr>`;
  }).join('');
}

async function cadastrarCliente() {
  const nome=document.getElementById('fn').value.trim();
  const tel=document.getElementById('ft').value.trim();
  const total=parseFloat(document.getElementById('fv').value);
  const nparc=parseInt(document.getElementById('fnp').value);
  const ds=document.getElementById('fd').value;
  const indicado=document.getElementById('fi').value.trim();
  const prods=getProds('new-prods');

  const endereco=document.getElementById('fend')?.value.trim()||'';
  const cep=document.getElementById('fcep')?.value.trim()||'';
  const entrada=parseFloat(document.getElementById('fent')?.value)||0;
  const forma_pagamento=document.getElementById('ffpg')?.value||'';
  const prazo_entrega=parseInt(document.getElementById('fpraz')?.value)||0;
  if (!nome||!tel||!total||!nparc||!ds){msg('fm','Preencha todos os campos obrigatórios.',false);return;}
  if (entrada>=total){msg('fm','Entrada deve ser menor que o valor total.',false);return;}
  const btn=document.getElementById('btn-cl');

  const saldo=total-entrada;
  const parc_val=saldo/nparc;
  const inicio=new Date(ds+'T12:00:00');
  const row={nome,tel,prod:prods.length?JSON.stringify(prods):null,total,nparc,parc_val,
    indicado:indicado||null,atrasado_manual:false,
    cpf:cpf||null,rg:rg||null,profissao:profissao||null,email:email||null,
    endereco:endereco||null,cep:cep||null,entrada:entrada||0,
    forma_pagamento:forma_pagamento||null,prazo_entrega:prazo_entrega||null};
  const {data:novo,error:e1}=await db.from('clientes').insert(row).select().single();
  if(e1){msg('fm','Erro: '+e1.message,false);if(btn){btn.disabled=false;btn.textContent='Cadastrar cliente';}return;}
  const parcelas=Array.from({length:nparc},(_,i)=>({
    cliente_id:novo.id,num:i+1,
    venc:addMeses(new Date(inicio),i).toISOString().split('T')[0],
    valor:parc_val,paga:false
  }));
  const {error:e2}=await db.from('parcelas').insert(parcelas);
  if(e2){msg('fm','Erro parcelas: '+e2.message,false);if(btn){btn.disabled=false;btn.textContent='Cadastrar cliente';}return;}
  msg('fm',`"${nome}" cadastrado com sucesso!`,true);

  ['fn','ft','fv','fnp','fcpf','frg','fprof','fem','fend','fcep','fent','fpraz'].forEach(id=>{const el=document.getElementById(id);if(el)el.value='';});

  await loadAll(); renders.clientes();
}

function _numExtenso(n){
  if(n===0)return'zero';
  const u=['','um','dois','três','quatro','cinco','seis','sete','oito','nove','dez','onze','doze','treze','quatorze','quinze','dezesseis','dezessete','dezoito','dezenove'];
  const d=['','','vinte','trinta','quarenta','cinquenta','sessenta','setenta','oitenta','noventa'];
  const ce=['','cento','duzentos','trezentos','quatrocentos','quinhentos','seiscentos','setecentos','oitocentos','novecentos'];
  if(n<20)return u[n];
  if(n<100)return d[Math.floor(n/10)]+(n%10?' e '+u[n%10]:'');
  if(n===100)return'cem';
  if(n<1000)return ce[Math.floor(n/100)]+(n%100?' e '+_numExtenso(n%100):'');
  if(n<1000000){const mil=Math.floor(n/1000),r=n%1000;return(mil===1?'mil':_numExtenso(mil)+' mil')+(r?(r<100?' e ':' ')+_numExtenso(r):'');}
  return String(n);
}
function _valorExtenso(v){
  const re=Math.floor(v),ct=Math.round((v-re)*100);
  let t='';
  if(re>0)t=_numExtenso(re)+(re===1?' real':' reais');
  if(ct>0){if(re>0)t+=' e ';t+=_numExtenso(ct)+(ct===1?' centavo':' centavos');}
  return t||'zero reais';
}
function _dataExtenso(ds){
  const ms=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
  const dt=new Date(ds+'T12:00:00');
  return dt.getDate()+' de '+ms[dt.getMonth()]+' de '+dt.getFullYear();
}

<h3 style="font-size:14px;font-weight:bold;margin:20px 0 10px;color:#000">Cláusula 2ª – Preço e Forma de Pagamento</h3>

<p><b>2.2.</b> O pagamento será realizado da seguinte forma: (i) a título de entrada/sinal, o valor de R$ ${fmtR(entrada).replace('R$','').trim()} (${_valorExtenso(entrada)}), pago no ato da assinatura deste Contrato; e (ii) o saldo remanescente de R$ ${fmtR(saldo).replace('R$','').trim()} (${_valorExtenso(saldo)}), em ${c.nparc} (${_numExtenso(c.nparc)}) parcelas fixas, iguais e sucessivas de R$ ${fmtR(c.parc_val).replace('R$','').trim()} (${_valorExtenso(c.parc_val)}) cada, vencendo-se a primeira em ${venc1?_dataExtenso(venc1):'[__/__/____]'} e as demais no mesmo dia dos meses subsequentes.</p>
<p><b>2.3.</b> O sinal/entrada previsto no item 2.2 (i) tem natureza confirmatória do negócio (arras confirmatórias) e será integralmente retido pelo <b>VENDEDOR</b> na hipótese de desistência ou cancelamento por parte do(a) <b>COMPRADOR(A)</b>, nos termos da Cláusula 6ª.</p>
<p><b>2.4.</b> As parcelas são fixas e não sofrem incidência de juros ou correção durante o seu curso normal, salvo em caso de atraso, hipótese em que se aplicará o disposto na Cláusula 3ª.</p>
<p><b>2.5.</b> O pagamento poderá ser realizado por meio de ${fpg}, conforme ajustado entre as Partes, considerando-se quitada cada parcela somente após a efetiva compensação do respectivo valor.</p>

<h3 style="font-size:14px;font-weight:bold;margin:20px 0 10px;color:#000">Cláusula 3ª – Inadimplemento e Vencimento Antecipado</h3>
<p><b>3.1.</b> O atraso no pagamento de qualquer parcela sujeitará o(a) <b>COMPRADOR(A)</b>, independentemente de notificação, ao pagamento de multa moratória de 10% (dez por cento) sobre o valor da parcela em atraso, acrescida de juros de mora de 1% (um por cento) ao mês, calculados pro rata die, além da correção monetária pelo índice IPCA, ou outro que o venha a substituir.</p>
<p><b>3.2.</b> O atraso no pagamento por período superior a 15 (quinze) dias implicará, de pleno direito e independentemente de aviso, interpelação ou notificação judicial ou extrajudicial, o vencimento antecipado de todas as demais parcelas vincendas, que se tornarão imediatamente exigíveis, acrescidas dos encargos previstos no item 3.1, aplicando-se o vencimento antecipado exclusivamente às hipóteses de pagamento parcelado (prestação continuada).</p>
<p><b>3.3.</b> Configurado o vencimento antecipado, poderá o <b>VENDEDOR</b> exigir de imediato a totalidade do saldo devedor, bem como adotar as medidas de cobrança e execução cabíveis, inclusive as previstas nas Cláusulas 5ª e 9ª.</p>
<p><b>3.4.</b> O não exercício, pelo <b>VENDEDOR</b>, de qualquer direito ou faculdade previstos neste Contrato constitui mera liberalidade, não implicando novação, renúncia ou alteração das condições ora pactuadas.</p>

<h3 style="font-size:14px;font-weight:bold;margin:20px 0 10px;color:#000">Cláusula 4ª – Entrega e Montagem</h3>
<p><b>4.1.</b> O prazo de entrega dos produtos é de ${prazo} (${_numExtenso(prazo)}) dias, contados da assinatura do contrato, podendo variar conforme o produto e o respectivo fabricante, conforme informado ao(à) <b>COMPRADOR(A)</b> no ato da venda.</p>
<p><b>4.2.</b> A entrega será realizada pelo próprio <b>VENDEDOR</b> no endereço indicado pelo(a) <b>COMPRADOR(A)</b> no preâmbulo, ou em outro endereço por este(a) previamente informado por escrito, dentro do Município da Grande São Paulo e Alto Tietê.</p>
<p><b>4.3.</b> A montagem e a instalação dos móveis estão incluídas no preço, sendo realizadas pelo <b>VENDEDOR</b> ou por equipe por ele designada, salvo disposição expressa em contrário no pedido de venda.</p>
<p><b>4.4.</b> O(A) <b>COMPRADOR(A)</b> obriga-se a fornecer, no momento da entrega e da montagem, ambiente adequado, limpo, desimpedido e com as instalações elétricas e hidráulicas necessárias, quando for o caso, arcando com eventual reagendamento decorrente da ausência dessas condições ou da sua ausência no local no horário combinado.</p>
<p><b>4.5.</b> Os prazos de entrega e montagem ficam automaticamente suspensos enquanto pendente o pagamento do sinal ou de qualquer parcela vencida, bem como na ocorrência de caso fortuito ou força maior, retomando-se o curso após cessada a causa impeditiva.</p>
<p><b>4.6.</b> No ato da entrega, o(a) <b>COMPRADOR(A)</b> deverá conferir os produtos, com suas eventuais ressalvas por escrito no comprovante de entrega, sendo que a ausência de ressalvas presume o recebimento dos produtos em perfeitas condições e em conformidade com o contratado.</p>

<h3 style="font-size:14px;font-weight:bold;margin:20px 0 10px;color:#000">Cláusula 5ª – Reserva de Domínio</h3>
<p><b>5.1.</b> Os produtos objeto deste Contrato são vendidos com reserva de domínio, nos termos dos artigos 521 a 528 do Código Civil, de modo que a propriedade dos bens permanece com o <b>VENDEDOR</b> até o pagamento integral do preço, ainda que a posse seja transferida ao(à) <b>COMPRADOR(A)</b> no ato da entrega.</p>
<p><b>5.2.</b> Enquanto não quitado o preço, o(a) <b>COMPRADOR(A)</b> é fiel depositário(a) dos produtos, obrigando-se a conservá-los, não podendo aliená-los, cedê-los, empenhá-los, dá-los em garantia ou removê-los para fora do endereço de entrega sem prévia e expressa autorização escrita do <b>VENDEDOR</b>.</p>
<p><b>5.3.</b> Verificado o inadimplemento e o vencimento antecipado nos termos da Cláusula 3ª, poderá o <b>VENDEDOR</b>, a seu exclusivo critério, requerer a apreensão e a retomada dos produtos com fundamento na reserva de domínio, recuperando a posse dos bens.</p>
<p><b>5.4.</b> Fica facultado ao <b>VENDEDOR</b>, a seu exclusivo critério, renunciar à reserva de domínio e à retomada dos produtos, optando por prosseguir na cobrança e na execução da integralidade do saldo devedor, com os encargos previstos neste Contrato, valendo-se do presente instrumento como título executivo extrajudicial, nos termos da Cláusula 9ª, sem que tal opção configure novação ou renúncia a qualquer outro direito.</p>

<h3 style="font-size:14px;font-weight:bold;margin:20px 0 10px;color:#000">Cláusula 6ª – Desistência, Cancelamento e Trocas</h3>
<p><b>6.1.</b> Em caso de desistência ou cancelamento do negócio por iniciativa do(a) <b>COMPRADOR(A)</b>, por qualquer motivo, o <b>VENDEDOR</b> reterá integralmente o valor pago a título de entrada/sinal, a título de perdas e danos previamente estabelecidas, sem prejuízo do disposto nos itens seguintes.</p>
<p><b>6.2.</b> Tratando-se de móveis modulados, planejados ou fabricados sob medida ou por encomenda, bem como de qualquer produto cuja fabricação, corte, montagem ou pedido junto ao fabricante já tenha sido iniciado, o(a) <b>COMPRADOR(A)</b> responderá, além da perda do sinal, pelos custos comprovadamente incorridos e pelas parcelas vencidas até a data da desistência.</p>
<p><b>6.3.</b> O(A) <b>COMPRADOR(A)</b> declara ter examinado previamente os produtos, conforme a Cláusula 1ª, e reconhece que a compra não foi realizada fora do estabelecimento comercial de forma a ensejar direito de arrependimento, não lhe assistindo, portanto, direito à devolução, à restituição de valores ou ao desfazimento do negócio por simples mudança de vontade.</p>
<p><b>6.4.</b> O <b>VENDEDOR</b> não pratica política de trocas ou devoluções por arrependimento, gosto, medida, cor ou conveniência do(a) <b>COMPRADOR(A)</b>, ressalvadas exclusivamente as hipóteses de vício ou defeito do produto, na forma da Cláusula 7ª e da legislação aplicável.</p>

<h3 style="font-size:14px;font-weight:bold;margin:20px 0 10px;color:#000">Cláusula 7ª – Garantia</h3>
<p><b>7.1.</b> Os produtos possuem garantia legal contra vícios de fabricação pelo prazo de 90 (noventa) dias, contados da data da entrega, nos termos do artigo 26 do Código de Defesa do Consumidor.</p>
<p><b>7.2.</b> Especificamente quanto a colchões, o <b>VENDEDOR</b> oferece garantia de 1 (um) ano, contado da data da entrega, contra defeitos de fabricação, observadas as condições de uso e conservação indicadas pelo fabricante.</p>
<p><b>7.3.</b> A garantia limita-se ao reparo ou à substituição do produto ou da peça defeituosa, a critério do <b>VENDEDOR</b>, não abrangendo: (i) danos decorrentes de mau uso, uso inadequado, negligência ou conservação imprópria; (ii) desgaste natural pelo uso; (iii) exposição a umidade, calor, sol ou produtos químicos em desacordo com as recomendações; (iv) danos causados por transporte, remontagem ou intervenção realizados por terceiros não autorizados pelo <b>VENDEDOR</b>; e (v) alterações, modificações ou consertos feitos pelo(a) próprio(a) <b>COMPRADOR(A)</b> ou por terceiros.</p>
<p><b>7.4.</b> Para acionar a garantia, o(a) <b>COMPRADOR(A)</b> deverá comunicar o <b>VENDEDOR</b> por escrito, descrevendo o vício ou defeito e permitindo a verificação do produto.</p>

<h3 style="font-size:14px;font-weight:bold;margin:20px 0 10px;color:#000">Cláusula 8ª – Obrigações das Partes</h3>
<p><b>8.1.</b> São obrigações do <b>VENDEDOR</b>:</p>
<p>(i) fornecer os produtos conforme especificado no pedido de venda;<br>(ii) realizar a entrega e a montagem no prazo e nas condições ajustados;<br>(iii) prestar a garantia nos termos da Cláusula 7ª; e<br>(iv) emitir os documentos fiscais correspondentes à venda.</p>
<p><b>8.2.</b> São obrigações do(a) <b>COMPRADOR(A)</b>:</p>
<p>(i) efetuar o pagamento do preço na forma e nos prazos ajustados;<br>(ii) conferir os produtos no ato da entrega;<br>(iii) zelar pela guarda e conservação dos produtos, sobretudo enquanto vigente a reserva de domínio;<br>(iv) fornecer condições adequadas para a entrega e a montagem; e<br>(v) manter atualizados seus dados de contato e endereço perante o <b>VENDEDOR</b>.</p>

<h3 style="font-size:14px;font-weight:bold;margin:20px 0 10px;color:#000">Cláusula 9ª – Título Executivo Extrajudicial</h3>
<p><b>9.1.</b> As Partes reconhecem que o presente Contrato, assinado por elas e por 2 (duas) testemunhas, constitui título executivo extrajudicial, líquido, certo e exigível, nos termos do artigo 784, inciso III, do Código de Processo Civil, autorizando a cobrança do saldo devedor por meio de ação de execução.</p>
<p><b>9.2.</b> Reconhecem, ainda, que os valores em aberto, acrescidos da multa, dos juros, da correção monetária e demais encargos previstos neste Contrato, poderão ser cobrados diretamente pela via executiva, independentemente de prévia ação de conhecimento.</p>
<p><b>9.3.</b> Em qualquer medida judicial ou extrajudicial de cobrança ou execução, o(a) <b>COMPRADOR(A)</b> responderá, ainda, pelas custas processuais e pelos honorários advocatícios, estes fixados em 20% (vinte por cento) sobre o valor do débito atualizado.</p>

<h3 style="font-size:14px;font-weight:bold;margin:20px 0 10px;color:#000">Cláusula 10ª – Proteção de Dados Pessoais (LGPD)</h3>
<p><b>10.1.</b> As Partes obrigam-se a tratar os dados pessoais a que tiverem acesso em razão deste Contrato em conformidade com a Lei nº 13.709/2018 (Lei Geral de Proteção de Dados – LGPD) e demais normas aplicáveis.</p>
<p><b>10.2.</b> O(A) <b>COMPRADOR(A)</b> autoriza o <b>VENDEDOR</b> a coletar e tratar seus dados pessoais fornecidos neste Contrato exclusivamente para as finalidades de execução, cobrança, cumprimento de obrigações legais e regulatórias e comunicação relativa ao negócio, pelo prazo necessário a tais finalidades.</p>
<p><b>10.3.</b> O <b>VENDEDOR</b> compromete-se a adotar medidas de segurança adequadas à proteção dos dados pessoais e a não os compartilhar com terceiros, salvo quando necessário à execução deste Contrato ou por exigência legal.</p>

<h3 style="font-size:14px;font-weight:bold;margin:20px 0 10px;color:#000">Cláusula 11ª – Disposições Finais</h3>
<p><b>11.1.</b> O presente Contrato representa o integral acordo entre as Partes com relação ao seu objeto, substituindo quaisquer tratativas, propostas ou entendimentos anteriores, verbais ou escritos.</p>
<p><b>11.2.</b> Qualquer alteração ou aditamento a este Contrato somente produzirá efeitos se realizado por escrito e assinado por ambas as Partes.</p>
<p><b>11.3.</b> A eventual tolerância de qualquer das Partes quanto ao descumprimento de obrigação pela outra não implicará novação, renúncia ou precedente, podendo a parte prejudicada exigir o cumprimento a qualquer tempo.</p>
<p><b>11.4.</b> A nulidade ou ineficácia de qualquer cláusula deste Contrato não afetará a validade das demais, que subsistirão em pleno vigor.</p>
<p><b>11.5.</b> As Partes autorizam a comunicação entre si por meio eletrônico (e-mail, aplicativos de mensagens e afins), reconhecendo a validade das notificações e avisos assim realizados para os fins deste Contrato.</p>
<p><b>11.6.</b> As Partes reconhecem a validade e a eficácia da assinatura deste Contrato por meio eletrônico, nos termos da Medida Provisória nº 2.200-2/2001, ficando facultada, a critério das Partes, a assinatura de forma física (manuscrita), tendo ambas as formas a mesma validade jurídica.</p>
<p><b>11.7.</b> O presente Contrato obriga as Partes e seus herdeiros e sucessores a qualquer título, não podendo ser cedido ou transferido por qualquer das Partes sem a prévia e expressa anuência, por escrito, da outra Parte.</p>
<p><b>11.8.</b> Para dirimir quaisquer controvérsias oriundas deste Contrato, as Partes elegem o Foro da Comarca de São Paulo, Estado de São Paulo, com exclusão de qualquer outro, por mais privilegiado que seja.</p>

function baixarContrato(cId, formato) {
  const c=clientes.find(x=>x.id===cId); if(!c)return;
  const html=_gerarContratoHTML(c);
  const nomeArq='Contrato_'+c.nome.replace(/[^a-zA-ZÀ-ú0-9]/g,'_');
  if(formato==='word'){
    const blob=new Blob([`<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40"><head><meta charset="utf-8"><style>@page{size:A4;margin:2cm}</style></head><body>${html}</body></html>`],{type:'application/msword'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');a.href=url;a.download=nomeArq+'.doc';a.click();
    URL.revokeObjectURL(url);
  } else {
    const container=document.createElement('div');
    container.id='_pdf_temp';
    container.innerHTML=html;
    document.body.appendChild(container);
    html2pdf().set({margin:[10,10,10,10],filename:nomeArq+'.pdf',image:{type:'jpeg',quality:0.98},
      html2canvas:{scale:2,useCORS:true,onclone:function(doc){
        var a=doc.getElementById('app');if(a)a.style.display='none';
        var l=doc.getElementById('loading');if(l)l.style.display='none';
        var m=doc.getElementById('modal-overlay');if(m)m.style.display='none';
        var bn=doc.querySelector('.bottom-nav');if(bn)bn.style.display='none';
      }},
      jsPDF:{unit:'mm',format:'a4',orientation:'portrait'}
    }).from(container).save().then(()=>container.remove());
  }
}
